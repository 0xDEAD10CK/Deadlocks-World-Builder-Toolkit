<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loot Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1, h2 {
      text-align: center;
      color: #2c3e50;
    }

    .button-grid {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }

    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #2980b9;
    }

    pre {
      background-color: #ecf0f1;
      padding: 20px;
      border-radius: 8px;
      max-width: 800px;
      margin: 0 auto;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

  <h1>Loot Generator</h1>

  <div class="button-grid">
    {% for type in ['hoard'] %}
      {% for cr in ['0_4', '5_10', '11_16', '17_plus'] %}
        <a href="{{ url_for('loot_page') }}?type={{ type }}&cr={{ cr }}">
          <button>{{ type.title() }} CR {{ cr.replace('_', '–') }}</button>
        </a>
      {% endfor %}
    {% endfor %}
  </div>

  <h2>Generated Loot</h2>

  {% if loot_result %}
    <pre>{{ loot_result | tojson(indent=2) }}</pre>
  {% else %}
    <pre>Click a button to generate loot.</pre>
  {% endif %}

</body>
</html>
